[versions]
google-truth = "1.4.5"
gradle-ktfmt = "0.25.0"
gradle-shadow = "9.1.0"
gradle-versions = "0.52.0"
junit = "6.0.1"
kotlin = "2.2.21"

[libraries]
google-truth = { module = "com.google.truth:truth", version.ref = "google-truth" }
gradle-ktfmt-plugin = { module = "com.ncorti.ktfmt.gradle:com.ncorti.ktfmt.gradle.gradle.plugin", version.ref = "gradle-ktfmt" }
gradle-shadow-plugin = { module = "com.gradleup.shadow:com.gradleup.shadow.gradle.plugin", version.ref = "gradle-shadow" }
gradle-versions-plugin = { module = "com.github.ben-manes:gradle-versions-plugin", version.ref = "gradle-versions" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
kotlin-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
